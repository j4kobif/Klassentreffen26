<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klassentreffen - Steckbrief Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .setup-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .setup-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        
        .file-input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        input[type="file"] {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .game-area {
            display: none;
        }
        
        .scores-board {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .scores-board h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: #f8f9fa;
            margin-bottom: 8px;
            border-radius: 6px;
            align-items: center;
        }
        
        .score-row.top1 {
            background: #ffd700;
            font-weight: bold;
        }
        
        .score-row.top2 {
            background: #c0c0c0;
        }
        
        .score-row.top3 {
            background: #cd7f32;
            color: white;
        }
        
        .profile-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .profile-number {
            color: #667eea;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .answers-section {
            margin-bottom: 20px;
        }
        
        .answer-box {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #e0e0e0;
        }
        
        .answer-box.revealed {
            background: #e8f4f8;
            border-left-color: #667eea;
        }
        
        .question-label {
            font-weight: 600;
            color: #333;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        
        .answer-text {
            color: #666;
            font-size: 16px;
        }
        
        .answer-hidden {
            color: #999;
            font-style: italic;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .reveal-section {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ffc107;
        }
        
        .reveal-progress {
            margin-bottom: 10px;
            font-size: 14px;
            color: #333;
        }
        
        .reveal-progress-bar {
            background: #e9ecef;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .reveal-progress-fill {
            background: #ffc107;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        
        .guess-section {
            background: #e8f4f8;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #667eea;
        }
        
        .guess-section h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .player-search {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .player-search input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .player-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }
        
        .player-option {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #e0e0e0;
            transition: background 0.2s;
        }
        
        .player-option:hover {
            background: #f0f0f0;
        }
        
        .player-option.selected {
            background: #667eea;
            color: white;
            border-bottom-color: #667eea;
        }
        
        .guess-feedback {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        
        .guess-feedback.correct {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .guess-feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
        }
        
        .modal-content h2 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .solution-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        
        .solution-name {
            font-weight: bold;
            color: #667eea;
            font-size: 18px;
        }
        
        .solution-answers {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        @media (max-width: 768px) {
            .header, .setup-section, .profile-card, .scores-board {
                padding: 20px;
            }
            
            .solution-answers {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 Steckbrief-Ratespiel</h1>
            <p id="status">Lade deine Profile...</p>
        </div>
        
        <div class="setup-section" id="setupSection">
            <h2>📥 Profile importieren</h2>
            <p style="margin-bottom: 15px; color: #666;">Lade die JSON-Datei mit allen Profilen hoch (exportiert vom Umfrage-Formular)</p>
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" accept=".json">
                <button class="btn btn-primary" onclick="loadProfiles()">📤 Profile laden</button>
            </div>
            <p id="profileCount" style="margin-top: 10px; font-size: 13px; color: #999;"></p>
        </div>
        
        <div class="game-area" id="gameArea">
            <div class="scores-board">
                <h3>📊 Punkte-Tabelle</h3>
                <div id="scoresContainer"></div>
            </div>
            
            <div id="profilesContainer"></div>
            
            <div style="text-align: center; margin-top: 30px;">
                <button class="btn btn-success" onclick="showSolutions()">🏆 Lösungen anzeigen</button>
                <button class="btn btn-secondary" onclick="resetGame()" style="margin-left: 10px;">🔄 Neues Spiel</button>
            </div>
        </div>
    </div>
    
    <!-- Lösungs-Modal -->
    <div class="modal" id="solutionModal">
        <div class="modal-content">
            <h2>🎓 Die Lösungen!</h2>
            <div id="solutionsList"></div>
            <button class="btn btn-secondary" onclick="closeSolutions()" style="width: 100%; margin-top: 20px;">Schließen</button>
        </div>
    </div>
    
    <script>
        let profiles = [];
        let currentProfileIndex = 0;
        let playerScores = {};
        let currentPlayer = '';
        
        const QUESTIONS = [
            { key: 'q1', label: '💼 Beruf/Situation' },
            { key: 'q2', label: '✈️ Länder bereist' },
            { key: 'q3', label: '🎯 Neues Hobby' },
            { key: 'q4', label: '📍 Region/Stadt' },
            { key: 'q5', label: '🗺️ Abenteuer' },
            { key: 'q6', label: '🐾 Haustiere' },
            { key: 'q7', label: '⏰ Chronotyp' },
            { key: 'q8', label: '⭐ Überraschung' }
        ];
        
        function loadProfiles() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) {
                alert('Bitte wähle eine JSON-Datei aus!');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    profiles = JSON.parse(e.target.result);
                    if (!Array.isArray(profiles)) throw new Error('Ungültiges Format');
                    
                    // Initialisiere Spieler-Scores
                    playerScores = {};
                    profiles.forEach(p => {
                        playerScores[p.name] = { score: 0, guesses: 0 };
                    });
                    
                    // Starte Quiz
                    document.getElementById('setupSection').style.display = 'none';
                    document.getElementById('gameArea').style.display = 'block';
                    document.getElementById('status').textContent = `${profiles.length} Profile geladen - Lasst das Spiel beginnen! 🎮`;
                    
                    renderGame();
                } catch (error) {
                    alert('Fehler beim Laden: ' + error.message);
                }
            };
            reader.readAsText(file);
        }
        
        function renderGame() {
            renderScores();
            renderProfiles();
        }
        
        function renderScores() {
            const sorted = Object.entries(playerScores)
                .sort((a, b) => b[1].score - a[1].score)
                .slice(0, 10);
            
            const scoresHTML = sorted.map((entry, idx) => {
                const [name, data] = entry;
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '  ';
                const rowClass = idx === 0 ? 'top1' : idx === 1 ? 'top2' : idx === 2 ? 'top3' : '';
                return `
                    <div class="score-row ${rowClass}">
                        <span>${medal} ${name}</span>
                        <span>${data.score} Punkte</span>
                    </div>
                `;
            }).join('');
            
            document.getElementById('scoresContainer').innerHTML = scoresHTML || '<p style="color: #999;">Noch keine Punkte</p>';
        }
        
        function renderProfiles() {
            const html = profiles.map((profile, idx) => {
                const revealedCount = Object.keys(profile).filter(k => 
                    k.startsWith('q') && document.getElementById(`reveal-${idx}`)
                ).length;
                
                return `
                    <div class="profile-card">
                        <div class="profile-number">Steckbrief #${idx + 1}</div>
                        
                        <div class="reveal-section">
                            <div class="reveal-progress">
                                Offenbarte Hinweise: <span id="revealCount-${idx}">0</span>/${QUESTIONS.length}
                            </div>
                            <div class="reveal-progress-bar">
                                <div class="reveal-progress-fill" id="revealBar-${idx}"></div>
                            </div>
                        </div>
                        
                        <div class="answers-section">
                            ${QUESTIONS.map((q, qIdx) => `
                                <div class="answer-box" id="answer-${idx}-${qIdx}">
                                    <div class="question-label">${q.label}</div>
                                    <div class="answer-text" id="answerText-${idx}-${qIdx}">
                                        <span class="answer-hidden">? versteckt</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <div class="controls">
                            <button class="btn btn-primary" onclick="revealNextAnswer(${idx})">
                                💡 Nächster Hinweis
                            </button>
                        </div>
                        
                        <div class="guess-section">
                            <h3>👤 Wer bin ich?</h3>
                            <input type="text" id="playerSearch-${idx}" placeholder="Name eingeben..." 
                                   onkeyup="filterPlayers(${idx})">
                            <div class="player-list" id="playerList-${idx}"></div>
                            <div class="guess-feedback" id="feedback-${idx}"></div>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('profilesContainer').innerHTML = html;
            
            // Initialisiere Player-Listen
            profiles.forEach((_, idx) => {
                renderPlayerList(idx, '');
            });
        }
        
        function renderPlayerList(profileIdx, filter) {
            const filtered = profiles.filter(p => 
                p.name.toLowerCase().includes(filter.toLowerCase())
            );
            
            const html = filtered.map(p => `
                <div class="player-option" onclick="makeGuess(${profileIdx}, '${p.name.replace(/'/g, "\\'")}')">
                    ${p.name}
                </div>
            `).join('');
            
            document.getElementById(`playerList-${profileIdx}`).innerHTML = html;
        }
        
        function filterPlayers(profileIdx) {
            const input = document.getElementById(`playerSearch-${profileIdx}`).value;
            renderPlayerList(profileIdx, input);
        }
        
        function revealNextAnswer(profileIdx) {
            let revealed = 0;
            for (let i = 0; i < QUESTIONS.length; i++) {
                const box = document.getElementById(`answer-${profileIdx}-${i}`);
                if (!box.classList.contains('revealed')) {
                    revealed++;
                    box.classList.add('revealed');
                    
                    const qKey = QUESTIONS[i].key;
                    const answer = profiles[profileIdx][qKey] || '-';
                    document.getElementById(`answerText-${profileIdx}-${i}`).innerHTML = answer;
                    
                    // Update Progress
                    document.getElementById(`revealCount-${profileIdx}`).textContent = revealed;
                    const percent = (revealed / QUESTIONS.length) * 100;
                    document.getElementById(`revealBar-${profileIdx}`).style.width = percent + '%';
                    
                    // Punkte basierend auf Offenbarte Hinweise
                    return;
                }
            }
        }
        
        function makeGuess(profileIdx, playerName) {
            const feedback = document.getElementById(`feedback-${profileIdx}`);
            const correctName = profiles[profileIdx].name;
            const revealedCount = document.querySelectorAll(`#answer-${profileIdx}-0`)[0]?.classList.contains('revealed') ? 
                Array.from(document.querySelectorAll(`[id^="answer-${profileIdx}"]`)).filter(el => el.classList.contains('revealed')).length : 0;
            
            if (playerName === correctName) {
                // Richtige Antwort!
                const points = Math.max(5 - revealedCount, 1); // Je weniger Hinweise, desto mehr Punkte
                playerScores[playerName].score += points;
                playerScores[playerName].guesses++;
                
                feedback.className = 'guess-feedback correct';
                feedback.innerHTML = `✅ Richtig! <strong>${playerName}</strong> - +${points} Punkte!`;
                
                // Zeige Namen
                document.getElementById(`answerText-${profileIdx}-0`).innerHTML = `<strong>✓ ${correctName}</strong>`;
                
                renderScores();
            } else {
                feedback.className = 'guess-feedback incorrect';
                feedback.innerHTML = `❌ Falsch! Das ist nicht ${playerName}`;
            }
        }
        
        function showSolutions() {
            const html = profiles.map((p, idx) => `
                <div class="solution-item">
                    <div class="solution-name">#${idx + 1}: ${p.name}</div>
                    <div class="solution-answers">
                        <div><strong>💼</strong> ${p.q1}</div>
                        <div><strong>✈️</strong> ${p.q2} Länder</div>
                        <div><strong>🎯</strong> ${p.q3}</div>
                        <div><strong>📍</strong> ${p.q4}</div>
                        <div><strong>🗺️</strong> ${p.q5}</div>
                        <div><strong>🐾</strong> ${p.q6} Haustiere</div>
                        <div><strong>⏰</strong> ${p.q7 || '-'}</div>
                        <div><strong>⭐</strong> ${p.q8 || '-'}</div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('solutionsList').innerHTML = html;
            document.getElementById('solutionModal').classList.add('active');
        }
        
        function closeSolutions() {
            document.getElementById('solutionModal').classList.remove('active');
        }
        
        function resetGame() {
            if (confirm('Spiel wirklich zurücksetzen?')) {
                document.getElementById('fileInput').value = '';
                document.getElementById('setupSection').style.display = 'block';
                document.getElementById('gameArea').style.display = 'none';
                profiles = [];
                playerScores = {};
                document.getElementById('status').textContent = 'Lade deine Profile...';
            }
        }
    </script>
</body>
</html>
